
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./.env:/app/.env
      - ${DATA_HOST_PATH:-.}/data:/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      - DATA_PATH=/data
    depends_on:
      - redis
      - memcached
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network

  memcached:
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"
    command: memcached -m 256 -c 1024
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data: